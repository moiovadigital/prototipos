/* =========================================================
   CSS CRITICO - embutido no <head> de cada pagina
   Gerado de css/styles.css: tokens, reset, cabecalho, hero,
   botoes, cabecalho de pagina interna, revelacao, flutuante.
   O restante de styles.css carrega sem bloquear (preload).

/* =========================================================
   ALAM — Academia de Letras de Águas Mornas
   Site institucional · protótipo
   Direção de arte: referências 05/06/07 da pasta referencia-visual
   Base escura dominante, painéis sobrepostos (sem faixas alternadas),
   retratos em moldura dourada, composições assimétricas por página.
   Paleta: ALAM-paleta de cores.png + ouro do brasão apenas como acento.
   Tipografia: pilha de fontes do sistema (sem dependência externa).
   ========================================================= */

:root{
  /* ---- Paleta ALAM (referencia-visual/ALAM-paleta de cores.png) ---- */
  --verde-950:#051F20;   /* profundidade: hero, rodapé, cabeçalho */
  --verde-900:#0B2B26;   /* base das páginas */
  --verde-800:#163832;   /* painéis */
  --verde-700:#235347;   /* blocos de destaque, botões */
  --salvia:#8EB69B;      /* texto secundário, versaletes */
  --menta:#E9F6EC;       /* texto claro e painéis claros (estimado do swatch) */

  /* ---- Ouro do brasão: filete, moldura, versaletes, 1 destaque/página ---- */
  --ouro-500:#C4A05A;
  --ouro-700:#8A6514;    /* ouro escuro — só sobre fundo claro (AA) */

  /* ---- Semântica ---- */
  --cor-fundo:var(--verde-900);
  --cor-texto:var(--menta);
  --cor-suave:var(--salvia);

  /* ---- Tipografia (sistema, 2 famílias) ---- */
  --fonte-titulo:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Times New Roman",serif;
  --fonte-texto:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --texto-base:clamp(1rem,.97rem + .16vw,1.0625rem);
  --linha-leitura:1.72;
  --medida-leitura:66ch;

  /* ---- Espaço e layout ---- */
  --container:1180px;
  --raio:3px;
  --raio-sm:2px;
  --header-h:76px;

  /* ---- Filetes ---- */
  --filete-ouro:1px solid rgba(196,160,90,.55);
  --filete-tenue:1px solid rgba(142,182,155,.22);
  --sombra-1:0 1px 2px rgba(0,0,0,.28);
  --sombra-2:0 18px 44px rgba(0,0,0,.42);
  --ease:cubic-bezier(.22,.61,.36,1);
}

/* ---------- Reset ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--header-h) + 16px)}
body{
  margin:0;
  font-family:var(--fonte-texto);
  font-size:var(--texto-base);
  line-height:var(--linha-leitura);
  color:var(--cor-texto);
  background:var(--cor-fundo);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img{max-width:100%;height:auto;display:block}
h1,h2,h3,h4{
  font-family:var(--fonte-titulo);
  font-weight:400;
  line-height:1.14;
  letter-spacing:-.012em;
  margin:0 0 .5em;
  color:var(--menta);
}
p{margin:0 0 1em}
a{color:var(--salvia);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
ul,ol{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
svg.icon{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

:focus-visible{outline:3px solid var(--ouro-500);outline-offset:3px;border-radius:2px}

/* Papel de fundo do site inteiro (background.jpg)
   Opacity .28 sobre --verde-950 mantém o texto AA:
   sálvia sobre o composto ≈ 6:1, menta ≈ 14:1 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:url("../img/background.webp") center / cover no-repeat;
  opacity:.28;
}
@media (max-width:768px){
  body::before{background-image:url("../img/background-768.webp")}
}

.container{width:min(100% - 2.5rem,var(--container));margin-inline:auto}

.skip-link{
  position:absolute;left:1rem;top:-100px;z-index:200;
  background:var(--ouro-500);color:var(--verde-950);
  padding:.75rem 1.25rem;border-radius:0 0 var(--raio) var(--raio);
  font-size:.9rem;font-weight:600;letter-spacing:.04em;
  transition:top .2s var(--ease);
}
.skip-link:focus{top:0}
.skip-link:focus-visible{outline-color:var(--verde-950)}

/* ---------- Tipografia de apoio ---------- */
.lead{font-size:clamp(1.05rem,1.5vw,1.18rem);line-height:1.68;color:var(--menta)}

.eyebrow{
  display:inline-flex;align-items:center;gap:.8rem;
  font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.26em;
  color:var(--salvia);margin-bottom:1.1rem;
}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--ouro-500);flex:none}
.eyebrow-gold{color:var(--ouro-500)}

.section{padding:clamp(3.8rem,7vw,6rem) 0}
.section + .section{border-top:var(--filete-tenue)}

.section-head{max-width:46rem;margin-bottom:clamp(2rem,4vw,3rem)}
.section-head h2{font-size:clamp(1.8rem,3.6vw,2.7rem);margin-bottom:.5rem}
.section-lead{font-size:1.04rem;color:var(--salvia);max-width:44rem;margin:0}

.subhead{margin:clamp(2.4rem,5vw,3.4rem) 0 1.3rem}
.subhead h3{font-size:1.45rem;margin:0}

/* Filete divisório discreto */
.rule{height:1px;background:var(--filete-tenue);border:0;margin:clamp(2rem,4vw,3rem) 0}
.rule-ouro{background:linear-gradient(90deg,rgba(196,160,90,.75),rgba(196,160,90,0))}

/* Ornamento: filete + losango dourado */
.ornament{
  display:flex;align-items:center;justify-content:center;gap:.85rem;
  color:var(--ouro-500);margin:clamp(1.6rem,3vw,2.4rem) 0;
}
.ornament::before,.ornament::after{
  content:"";height:1px;width:clamp(48px,10vw,110px);
  background:linear-gradient(90deg,transparent,currentColor);
}
.ornament::after{background:linear-gradient(270deg,transparent,currentColor)}
.ornament span{width:7px;height:7px;background:currentColor;transform:rotate(45deg);flex:none}

/* Moldura dourada (retratos, convites, fotografias) */
.frame{
  margin:0;background:var(--verde-800);
  padding:8px;border:var(--filete-ouro);box-shadow:var(--sombra-2);
}
.frame img{width:100%;display:block}
.frame figcaption{font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--salvia);padding:.7rem .3rem .2rem;text-align:center}

/* ---------- Botões ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  min-height:48px;padding:.78rem 1.6rem;border-radius:var(--raio);
  font-family:var(--fonte-texto);font-weight:600;font-size:.9rem;
  letter-spacing:.045em;line-height:1.2;
  border:1px solid transparent;cursor:pointer;text-align:center;
  transition:background-color .2s var(--ease),color .2s var(--ease),
             border-color .2s var(--ease),transform .2s var(--ease);
}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}

.btn-ouro{background:var(--ouro-500);color:var(--verde-950);border-color:var(--ouro-500)}
.btn-ouro:hover{background:#D6B673;border-color:#D6B673;color:var(--verde-950)}

.btn-menta{background:var(--menta);color:var(--verde-950);border-color:var(--menta)}
.btn-menta:hover{background:#fff;border-color:#fff;color:var(--verde-950)}

.btn-linha{background:transparent;color:var(--menta);border-color:rgba(196,160,90,.7)}
.btn-linha:hover{background:rgba(196,160,90,.14);border-color:var(--ouro-500);color:var(--menta)}

.btn-escuro{background:var(--verde-700);color:var(--menta);border-color:var(--verde-700)}
.btn-escuro:hover{background:#2B6153;border-color:#2B6153;color:#fff}

.btn-sm{min-height:42px;padding:.55rem 1.15rem;font-size:.83rem;letter-spacing:.06em}
.btn-block{width:100%}

/* ---------- Cabeçalho ---------- */
.site-header{
  position:sticky;top:0;z-index:100;
  background:rgba(5,31,32,.96);
  backdrop-filter:saturate(140%) blur(8px);
  -webkit-backdrop-filter:saturate(140%) blur(8px);
  border-bottom:1px solid rgba(196,160,90,.35);
  transition:box-shadow .25s var(--ease);
}
.site-header.is-stuck{box-shadow:0 8px 24px rgba(0,0,0,.35)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:var(--header-h)}

.brand{display:flex;align-items:center;gap:.75rem;color:var(--menta)}
.brand:hover{text-decoration:none}
.brand-mark{
  width:50px;height:50px;border-radius:50%;object-fit:cover;
  background:var(--menta);padding:3px;border:1px solid rgba(196,160,90,.7);
}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text strong{font-family:var(--fonte-titulo);font-weight:400;font-size:1.4rem;letter-spacing:.1em;color:var(--menta)}
.brand-text span{font-size:.65rem;text-transform:uppercase;letter-spacing:.16em;color:var(--salvia)}

.nav{display:flex;align-items:center;gap:1.1rem}
.nav-list{display:flex;align-items:center;gap:.15rem}

/* Linha do item ativo (desktop) — sublinha aparece no hover e permanece no ativo */
.nav-list a{
  display:block;padding:.6rem .7rem;border-radius:var(--raio-sm);
  font-size:.875rem;font-weight:500;letter-spacing:.02em;color:var(--menta);
  position:relative;
  transition:color .2s var(--ease);
}
.nav-list a::after{
  content:"";position:absolute;left:.7rem;right:.7rem;bottom:.25rem;height:1.5px;
  background:var(--ouro-500);border-radius:2px;
  transform:scaleX(0);transform-origin:center;
  transition:transform .25s var(--ease);
}
.nav-list a:hover{color:#fff;text-decoration:none}
.nav-list a:hover::after,
.nav-list a:focus-visible::after{transform:scaleX(1)}
.nav-list a[aria-current="page"]{color:#fff;font-weight:600}
.nav-list a[aria-current="page"]::after{transform:scaleX(1)}

.nav-toggle{
  display:none;width:46px;height:46px;align-items:center;justify-content:center;
  background:transparent;border:1px solid rgba(142,182,155,.4);border-radius:var(--raio);
  cursor:pointer;color:var(--menta);
}
.nav-toggle .icon{width:24px;height:24px}
.nav-toggle .icon-close{display:none}
.nav-toggle[aria-expanded="true"] .icon-menu{display:none}
.nav-toggle[aria-expanded="true"] .icon-close{display:block}

/* ---------- Hero (home) — assimétrico ---------- */
.hero{
  position:relative;isolation:isolate;overflow:hidden;
  background:var(--verde-950);
  padding:clamp(3.4rem,7vw,5.6rem) 0 clamp(3.6rem,7vw,5.8rem);
}
.hero::before{
  content:"";position:absolute;inset:0;z-index:-2;
  background:
    radial-gradient(900px 520px at 12% 20%,rgba(35,83,71,.75),transparent 70%),
    linear-gradient(180deg,rgba(5,31,32,.94),rgba(5,31,32,.99));
}
/* Hero com foto de fundo apenas no celular — a desktop mantém o fundo sólido */
@media (max-width:768px){
  .hero::before{
    background:
      radial-gradient(900px 520px at 12% 20%,rgba(35,83,71,.55),transparent 70%),
      linear-gradient(180deg,rgba(5,31,32,.86),rgba(5,31,32,.92)),
      url("../img/hero-768.webp") center / cover no-repeat;
  }
}
.hero::after{
  content:"";position:absolute;inset:clamp(.7rem,1.6vw,1.3rem);z-index:-1;
  border:1px solid rgba(196,160,90,.28);pointer-events:none;
}
.hero-grid{
  display:grid;grid-template-columns:1.05fr .95fr;
  gap:clamp(2rem,5vw,4rem);align-items:center;
}
.hero h1{
  font-size:clamp(2.3rem,5.4vw,3.9rem);font-weight:400;color:#fff;
  margin-bottom:.7rem;letter-spacing:-.018em;
}
.hero-motto{
  font-family:var(--fonte-titulo);font-style:italic;
  font-size:clamp(1.15rem,2.2vw,1.5rem);color:var(--ouro-500);margin-bottom:1.3rem;
}
.hero-lead{max-width:34rem;color:rgba(233,246,236,.85);margin-bottom:2rem}
.hero-actions{display:flex;flex-wrap:wrap;gap:.9rem}
.hero-meta{
  display:flex;flex-wrap:wrap;gap:.6rem 1.6rem;margin-top:2.2rem;
  padding-top:1.4rem;border-top:var(--filete-tenue);
  font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--salvia);
}
.hero-meta span{display:inline-flex;align-items:center;gap:.5rem}
.hero-meta span::before{content:"";width:5px;height:5px;background:var(--ouro-500);transform:rotate(45deg)}

.hero-copy{min-width:0}
.hero-visual{position:relative;min-width:0}
.hero-visual .frame{transform:translateY(-6px)}
.hero-visual .frame img{aspect-ratio:1/1;object-fit:cover}

/* ---------- Cabeçalho de página interna ---------- */
.page-hero{
  position:relative;isolation:isolate;overflow:hidden;
  background:var(--verde-950);
  padding:clamp(2.2rem,4.5vw,3.4rem) 0 clamp(2.2rem,4.5vw,3.2rem);
  border-bottom:var(--filete-ouro);
}
.page-hero::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(700px 320px at 88% 10%,rgba(35,83,71,.7),transparent 70%),
    url("../img/hero.webp") center 40% / cover no-repeat;
  opacity:.9;
}
@media (max-width:768px){
  .page-hero::before{background-image:
    radial-gradient(700px 320px at 88% 10%,rgba(35,83,71,.7),transparent 70%),
    url("../img/hero-768.webp") center 40% / cover no-repeat}
}
.page-hero::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(90deg,rgba(5,31,32,.97) 35%,rgba(5,31,32,.72) 100%);
}
.page-hero h1{color:#fff;font-size:clamp(1.9rem,4.2vw,3rem);font-weight:400;margin:.5rem 0 .5rem}
.page-hero .lead{color:rgba(233,246,236,.86);max-width:44rem;margin:0;font-size:1.05rem}
.page-hero-inner{position:relative;z-index:1}

.breadcrumb ol{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center;margin:0;padding:0;list-style:none}
.breadcrumb li{display:flex;align-items:center;gap:.55rem;font-size:.72rem;
  text-transform:uppercase;letter-spacing:.16em;color:rgba(233,246,236,.7)}
.breadcrumb li + li::before{content:"/";color:rgba(196,160,90,.8)}
.breadcrumb a{color:var(--ouro-500);font-weight:600}
.breadcrumb a:hover{color:var(--menta)}
.breadcrumb [aria-current="page"]{color:rgba(233,246,236,.95)}


.fab-top{
  position:fixed;right:clamp(1rem,3vw,2rem);bottom:clamp(1rem,3vw,2rem);z-index:120;
  width:52px;height:52px;padding:0;border:1px solid rgba(196,160,90,.6);
  border-radius:var(--raio);cursor:pointer;
  background:var(--verde-700);color:var(--menta);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 28px rgba(0,0,0,.45);
  opacity:0;visibility:hidden;transform:translateY(14px);
  transition:opacity .25s var(--ease),transform .25s var(--ease),
             visibility .25s,background-color .2s var(--ease);
}
.fab-top.is-visible{opacity:1;visibility:visible;transform:none}
.fab-top:hover{background:#2B6153}
.fab-top .icon{width:22px;height:22px}

/* ---------- Revelação ao rolar (escondida só com JS ativo) ---------- */
.has-js .reveal{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.has-js .reveal.is-visible{opacity:1;transform:none}


/* ---- Responsivo (somente blocos acima da dobra) ---- */
@media (max-width:1280px) and (min-width:1001px){
  .nav-cta{display:none}
  .nav{gap:.7rem}
  .nav-list a{padding:.6rem .5rem;font-size:.85rem}
}
@media (max-width:1024px){
  .hero-grid{grid-template-columns:1fr}
  .hero-visual .frame{transform:none}
}
@media (max-width:1000px){
  .nav-toggle{display:inline-flex}
  .nav{
    position:absolute;left:0;right:0;top:100%;
    flex-direction:column;align-items:stretch;gap:.6rem;
    background:var(--verde-950);border-bottom:1px solid rgba(196,160,90,.4);
    padding:1rem 1.25rem 1.4rem;box-shadow:var(--sombra-2);
    display:none;
  }
  .nav.is-open{display:flex}
  .nav-list{flex-direction:column;align-items:stretch;gap:.1rem}
  .nav-list a{padding:.85rem .8rem .85rem 1.7rem;font-size:1rem;min-height:46px;display:flex;align-items:center}
  .nav-list a::after{left:.6rem;right:auto;width:14px;bottom:calc(50% - 1px);transform-origin:left}
  .nav-list a[aria-current="page"]{background:rgba(35,83,71,.4)}
  .nav-cta{width:100%}
  .brand-text span{display:none}
}
@media (max-width:700px){
  .hero-actions .btn{width:100%}
}
@media (max-width:460px){
  .container{width:calc(100% - 1.75rem)}
  .brand-mark{width:44px;height:44px}
}

/* ---- Movimento reduzido ---- */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .has-js .reveal{opacity:1;transform:none}
}
</style>
