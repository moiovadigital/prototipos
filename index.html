<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moiova Digital — Protótipos</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Área de protótipos da Moiova Digital.">
<style>
  :root { --verde:#0d3b2e; --dourado:#dcb96a; --marfim:#fbf8f1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:grid; place-items:center;
    background:var(--marfim); color:var(--verde);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px; line-height:1.6;
  }
  main { max-width:560px; text-align:center; }
  .marca {
    display:inline-block; font-size:.72rem; letter-spacing:.28em;
    text-transform:uppercase; color:#7a6532;
    border-bottom:2px solid var(--dourado); padding-bottom:8px; margin-bottom:28px;
  }
  h1 { font-family:Georgia,"Times New Roman",serif; font-size:clamp(1.9rem,6vw,2.6rem); font-weight:600; margin-bottom:14px; }
  p { color:#3d5c51; font-size:1.02rem; }
  .fio { width:64px; height:2px; background:var(--dourado); margin:26px auto; }
  small { display:block; margin-top:26px; color:#7d8f88; font-size:.8rem; }
</style>
</head>
<body>
<main>
  <span class="marca">Moiova Digital</span>
  <h1>Área de protótipos</h1>
  <div class="fio"></div>
  <p>Os protótipos são entregues por link individual e ficam disponíveis por tempo determinado.</p>
  <small>Se você veio por um link, ele continua válido enquanto não expirar.</small>
</main>
</body>
</html>
